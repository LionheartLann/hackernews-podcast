name: Hourly Podcast RSS Update

on:
  schedule:
    # Run every hour; script decides whether to skip/process.
    - cron: "5 * * * *"
  workflow_dispatch:

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run podcast pipeline
        run: python generate_podcast.py
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          TTS_VOICE: ${{ vars.TTS_VOICE }}
          TTS_RATE: ${{ vars.TTS_RATE }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_PUBLIC_URL: ${{ vars.R2_PUBLIC_URL }}
          GITHUB_PAGES_REPO: ${{ vars.GITHUB_PAGES_REPO }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
